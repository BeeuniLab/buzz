name: "buzzplay-react-playable"
description: "BuzzPlay mobile-first React/Vite playable content template for short interactive posts, meme games, social challenges, character toys, quizzes, touch-driven stories, and result-card loops."
base_reference: "vite-reference"
projectType: app
renderMode: sandbox
disabled: false
hiddenFromSelection: false
inherit_dependencies: true

package_patches:
  name: "buzzplay-react-playable"

file_patches:
  - file: "tailwind.config.js"
    replacements:
      - find: "/** @type {import('tailwindcss').Config} */\nexport default {"
        replace: "import tailwindcssAnimate from 'tailwindcss-animate'\n\n/** @type {import('tailwindcss').Config} */\nexport default {"
      - find: "plugins: [require(\"tailwindcss-animate\")]"
        replace: "plugins: [tailwindcssAnimate]"
